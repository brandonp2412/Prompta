[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompta"
version = "0.1.0"
description = "Periodic fresh-chat prompt sender for ChatGPT"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "websockets>=12.0",
]

[project.scripts]
prompta = "prompta.core:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prompta"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "ty>=0.0.79",
]
