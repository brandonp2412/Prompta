name: Prompta

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prompta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync
        run: uv sync --locked
      - name: Test
        run: uv run pytest -q
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: ty
        run: uv run ty check

  readme-screenshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: prompta
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync
        run: uv sync --locked
      - name: Generate README screenshot
        run: uv run python scripts/generate_readme_screenshot.py
      - name: Commit generated screenshot
        run: |
          if git diff --quiet -- docs/assets/prompta-ls.png; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/assets/prompta-ls.png
          git commit -m "Update generated README screenshot"
          git push
