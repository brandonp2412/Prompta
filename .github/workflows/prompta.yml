name: Prompta

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prompta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Sync
        run: |
          uv sync --locked
          bun install --frozen-lockfile
      - name: Test
        run: uv run pytest -q
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: TypeScript
        run: |
          bun run check
          git diff --exit-code -- src/static/app.js
      - name: ty
        run: uv run ty check

  readme-screenshots:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: prompta
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium
      - name: Generate README screenshots
        run: uv run python scripts/generate_readme_screenshots.py
      - name: Commit generated screenshots
        run: |
          if git diff --quiet -- docs/prompta-cli.png docs/prompta-ui-mobile.png; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/prompta-cli.png docs/prompta-ui-mobile.png
          git commit -m "Update generated README screenshots"
          git push
