name: Prompta

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prompta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync
        run: uv sync --locked
      - name: Test
        run: uv run pytest -q
      - name: Ruff
        run: uv run ruff check src tests
      - name: ty
        run: uv run ty check
