# Select a schema family with `alembic --name runtime ...` (or results/ownership).
# Application startup and prompta-migrate supply their existing DB connection.
[runtime]
script_location = %(here)s/src/migrations
version_locations = %(here)s/src/migrations/runtime
path_separator = os
version_table = alembic_runtime_version

[results]
script_location = %(here)s/src/migrations
version_locations = %(here)s/src/migrations/results
path_separator = os
version_table = alembic_results_version

[ownership]
script_location = %(here)s/src/migrations
version_locations = %(here)s/src/migrations/ownership
path_separator = os
version_table = alembic_ownership_version
