[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prompta"
version = "0.1.0"
description = "Periodic fresh-chat prompt sender for ChatGPT"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "playwright>=1.55.0",
    "websockets>=12.0",
]

[project.scripts]
prompta = "prompta.core:main"
prompta-ui = "prompta.web:main"

[tool.setuptools]
packages = ["prompta"]
package-dir = { prompta = "src" }
include-package-data = false

[tool.setuptools.package-data]
prompta = ["static/*", "ui/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["prompta"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
config-settings = { editable_mode = "strict" }

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "ty>=0.0.79",
]
