[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prompta"
version = "0.1.0"
description = "Scheduled fresh-chat prompt dispatcher for ChatGPT"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "alembic>=1.13",
    "playwright>=1.55.0",
    "sqlalchemy>=2.0",
]

[project.scripts]
prompta = "prompta.core:main"
prompta-ui = "prompta.web:main"
prompta-delivery-worker = "prompta.delivery_worker:main"
prompta-scheduler = "prompta.scheduler_service:main"

[tool.setuptools]
packages = ["prompta"]
package-dir = { prompta = "src" }
include-package-data = false

[tool.setuptools.package-data]
prompta = ["static/*", "ui/*", "browser_scripts/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
extend-select = [
    "ANN",
    "PYI",
    "PGH003",
    "PGH004",
    "TID251",
]
ignore = ["E501"]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
suppress-none-returning = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Model the type or use object and narrow it."
"typing.cast".msg = "Prove or narrow the type instead of using cast()."
"typing.no_type_check".msg = "Do not disable type checking."
"typing_extensions.Any".msg = "Model the type or use object and narrow it."
"typing_extensions.cast".msg = "Prove or narrow the type instead of using cast()."
"typing_extensions.no_type_check".msg = "Do not disable type checking."

[tool.ruff.lint.isort]
known-first-party = ["prompta"]

[tool.ty.rules]
missing-type-argument = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
disjoint-cast = "error"
redundant-cast = "error"
dynamic-function-decorator-return = "error"
blanket-ignore-comment = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
ignore-comment-unknown-rule = "error"
possibly-unresolved-reference = "error"
unsupported-dynamic-base = "error"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
config-settings = { editable_mode = "strict" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
